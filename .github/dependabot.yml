version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "risk:dependencies"
    commit-message:
      prefix: "chore"

  # workspace/ is the Nx/pnpm monorepo itself — grouping every minor/patch
  # bump into one PR (rather than one PR per package) is what makes the
  # extended check.yml gate below worth having: an Nx-coupled workspace
  # can pass a single isolated bump and still break when two land
  # together, so batching means the full lint/typecheck/test/build/e2e
  # gate runs once against the combined result instead of N times against
  # N partial ones. Nx's own coupled-upgrade migrations (nx + @nx/*) stay
  # out of this and are handled by nx-migrate.yml instead, since `nx
  # migrate` — not Dependabot — is what keeps that plugin set mutually
  # compatible. `exclude-patterns` only keeps nx/@nx/* out of the
  # minor-and-patch group — Dependabot still opens an individual PR per
  # excluded package regardless, so `ignore` (which filters a dependency
  # out before PR creation, not just out of a group) is what actually
  # stops them.
  - package-ecosystem: "npm"
    directory: "/workspace"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "nx"
          - "@nx/*"
    ignore:
      - dependency-name: "nx"
      - dependency-name: "@nx/*"
    labels:
      - "risk:dependencies"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "risk:dependencies"
      - "risk:ci"
    commit-message:
      prefix: "chore"
