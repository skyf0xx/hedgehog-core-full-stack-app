name: Nx migrate

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: github.repository == 'skyf0xx/hedgehog-core-full-stack-app'
    # Matches check.yml's workspace-build job (and workspace/docker-
    # compose.yml / .env.example), so api-e2e and the api dev server it
    # drives (npm run dev via `nx e2e`) can reach a real database instead
    # of failing closed with ECONNREFUSED.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      WEB_ORIGIN: http://localhost:3000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      - run: cd workspace && pnpm install --frozen-lockfile

      # nx migrate resolves nx + every @nx/* plugin to one mutually
      # compatible version set (Nx's own coupled-upgrade tool) and
      # applies the codemods each migration needs, then --run-migrations
      # applies them and deletes the generated migrations.json. A plain
      # version bump with no codemods never writes migrations.json in
      # the first place — --if-exists makes that a successful no-op
      # instead of the fatal "File 'migrations.json' doesn't exist"
      # error, so the diff step below still runs and correctly reports
      # no change.
      - run: cd workspace && npx nx migrate latest

      - run: cd workspace && npx nx migrate --run-migrations --if-exists

      - run: cd workspace && pnpm install --no-frozen-lockfile

      - id: diff
        run: |
          if git diff --quiet -- workspace; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.diff.outputs.changed == 'true'
        run: cd workspace && npx nx run-many --target=lint,typecheck,test,build --all

      - if: steps.diff.outputs.changed == 'true'
        run: cd workspace && npx playwright install --with-deps

      - if: steps.diff.outputs.changed == 'true'
        run: cd workspace && npx nx run-many --target=e2e --all

      # Proves the migration didn't just leave existing apps working —
      # it must also leave every layer generator producing code that
      # still typechecks and builds, since scaffolding a fresh domain
      # module is the first thing a consuming project does after
      # `hedgehog init`. Runs in dependency order (schema before
      # contract before repository/service before controller/hook
      # before screen) and the generated module is discarded, not
      # committed — this is a smoke test, not a fixture.
      - if: steps.diff.outputs.changed == 'true'
        run: |
          cd workspace
          FIELDS="title:string(500),done:boolean"
          npx nx g @hedgehog/generators:schema ci-smoke-test --fields="$FIELDS" --no-interactive
          npx nx g @hedgehog/generators:contract ci-smoke-test --fields="$FIELDS" --no-interactive
          npx nx g @hedgehog/generators:repository ci-smoke-test --no-interactive
          npx nx g @hedgehog/generators:service ci-smoke-test --no-interactive
          npx nx g @hedgehog/generators:controller ci-smoke-test --fields="$FIELDS" --no-interactive
          npx nx g @hedgehog/generators:hook ci-smoke-test --no-interactive
          npx nx g @hedgehog/generators:screen ci-smoke-test --no-interactive

      # The controller/hook generators add new workspace:* deps (the
      # contract/repository/service/hook libs they wire up) to
      # apps/api/package.json and apps/web/package.json. Those only
      # exist as node_modules symlinks after another install — without
      # this, typecheck/build below fails with "Cannot find module"
      # for every generated package, even though the generators
      # themselves ran cleanly.
      - if: steps.diff.outputs.changed == 'true'
        run: cd workspace && pnpm install --no-frozen-lockfile

      # api/web's own typecheck only resolves the generated libs'
      # .d.ts files from disk — it doesn't build them. Typechecking
      # --all first walks the project graph in dependency order (the
      # new contracts/hooks/repository/service libs before api/web),
      # so their declaration output exists by the time api/web needs
      # it. Skipping this makes api/web:typecheck fail with TS6305
      # ("output file has not been built from source file") even
      # though every project passes typecheck individually.
      - if: steps.diff.outputs.changed == 'true'
        run: cd workspace && npx nx run-many --target=typecheck --all

      - if: steps.diff.outputs.changed == 'true'
        run: cd workspace && npx nx run-many --target=build --projects=api,web

      # The add-on gate. The domain-module smoke test above proves the
      # migration left the generators producing working code; this
      # proves it also left the three add-ons (Auth, Queue, Mobile)
      # scaffoldable, which the generator test never touches — an
      # add-on step runs on a consuming project's machine at Bootstrap
      # time, so a break here surfaces in a user's Bootstrap run rather
      # than anywhere this repo would see it.
      #
      # Auth and Queue are declared dependencies, so the install above
      # already resolved them: what needs proving is that their
      # Bootstrap steps' generators still run against the migrated tree
      # and the result typechecks. Mobile's packages are not in the
      # install (see workspace/addon-versions.json for why) — this step
      # installs them at their pinned versions, which is also the only
      # place a bad Mobile pin can be caught.
      #
      # @nx/expo must match the rest of the @nx/* matrix or the
      # generator fails at resolution rather than at install, so the
      # equality is asserted before anything is installed. `nx migrate`
      # bumps the @nx/* entries in package.json but has no way to know
      # about addon-versions.json, so this assertion is what turns a
      # migration into a red run instead of a silently stale pin.
      - if: steps.diff.outputs.changed == 'true'
        run: |
          cd workspace
          NX_VERSION=$(node -p "require('./package.json').devDependencies.nx")
          EXPO_VERSION=$(node -p "require('./addon-versions.json').mobile['@nx/expo']")
          if [ "$NX_VERSION" != "$EXPO_VERSION" ]; then
            echo "::error::@nx/expo is pinned at $EXPO_VERSION in addon-versions.json but the @nx/* matrix is at $NX_VERSION. Nx requires them identical — update addon-versions.json."
            exit 1
          fi

      # Auth: packages/auth is a plain @nx/js lib, and the Bootstrap
      # step's own packages are already installed. Scaffolding it and
      # importing better-auth from it is what proves the declared
      # versions actually resolve together against the migrated tree,
      # rather than only installing cleanly.
      - if: steps.diff.outputs.changed == 'true'
        run: |
          cd workspace
          npx nx g @nx/js:lib packages/auth --bundler=none --unitTestRunner=vitest --no-interactive
          cat > packages/auth/src/index.ts <<'EOF'
          import { betterAuth } from 'better-auth';
          import { drizzleAdapter } from 'better-auth/adapters/drizzle';
          import { AuthModule } from '@thallesp/nestjs-better-auth';

          export const auth = betterAuth({
            database: drizzleAdapter({}, { provider: 'pg' }),
            secret: process.env.BETTER_AUTH_SECRET ?? 'ci-smoke-test-secret',
          });

          export const authModule = AuthModule;
          EOF

      # Queue: apps/worker is a plain @nx/node app. Same shape as Auth —
      # scaffold, then import the declared packages so a resolution
      # break in bullmq/ioredis fails typecheck instead of surfacing at
      # a consuming project's Bootstrap.
      - if: steps.diff.outputs.changed == 'true'
        run: |
          cd workspace
          npx nx g @nx/node:app apps/worker --no-interactive
          cat > apps/worker/src/main.ts <<'EOF'
          import { Queue } from 'bullmq';
          import IORedis from 'ioredis';

          const connection = new IORedis(
            process.env.REDIS_URL ?? 'redis://localhost:6379',
            { maxRetriesPerRequest: null },
          );

          export const smokeQueue = new Queue('ci-smoke-test', { connection });
          EOF

      # Mobile: installs the pinned add-on packages, then runs the same
      # generator the Bootstrap step runs. --unitTestRunner=jest matches
      # the Bootstrap step (the generator's own default is `none`, which
      # would leave apps/mobile with no test target).
      - if: steps.diff.outputs.changed == 'true'
        run: |
          cd workspace
          NX_EXPO=$(node -p "require('./addon-versions.json').mobile['@nx/expo']")
          NATIVEWIND=$(node -p "require('./addon-versions.json').mobile.nativewind")
          pnpm add -w -D "@nx/expo@$NX_EXPO"
          pnpm add -w "nativewind@$NATIVEWIND"
          npx nx g @nx/expo:app apps/mobile --unitTestRunner=jest --no-interactive
          # @nx/expo's generated test-setup.ts declares defineGlobal with
          # untyped parameters, which is a TS7006 error under the core's
          # `strict: true` base tsconfig. The Bootstrap step's Mobile
          # section carries the same fix — this mirrors it so the gate
          # tests the workspace a consuming project actually ends up
          # with. Drop both when @nx/expo ships the annotations.
          sed -i 's/const defineGlobal = (name, value) => {/const defineGlobal = (name: string, value: unknown) => {/' apps/mobile/src/test-setup.ts

      # Same reason the domain-module smoke test reinstalls before
      # typechecking: the generators add workspace:* deps that only
      # exist as node_modules symlinks after another install.
      - if: steps.diff.outputs.changed == 'true'
        run: cd workspace && pnpm install --no-frozen-lockfile

      - if: steps.diff.outputs.changed == 'true'
        run: cd workspace && npx nx run-many --target=typecheck --all

      # The generators both add new files under apps/, packages/, and
      # libs/, and rewrite existing tracked files in place — barrel
      # files under apps/ and packages/ (e.g.
      # packages/db/src/schema/index.ts), plus root nx.json and
      # tsconfig.json and a root .gitignore the framework writes as a
      # side effect — checkout reverts the rewrites, clean removes the
      # new files. libs/ only ever holds generator output (no tracked
      # content ever lived there), so it's checkout's to clean but not
      # to check out — a checkout naming an untracked-only path fails
      # with "pathspec 'libs' did not match any file(s)".
      #
      # The add-on gate widens both halves of this. package.json and
      # .vscode/extensions.json join the checkout: the Mobile gate adds
      # @nx/expo and nativewind to the first (they are pinned in
      # addon-versions.json precisely so they stay out of the shipped
      # install, so the gate's own additions must not survive into the
      # PR — which is why the @nx/* equality is asserted rather than
      # written), and @nx/expo:app rewrites the second. babel.config.json,
      # jest.config.ts, jest.preset.cjs, .vscode/launch.json and
      # tools/ join the clean: the Expo generator writes all of them at
      # the workspace root as a side effect of adding its first
      # React Native project, and each is untracked here.
      - if: steps.diff.outputs.changed == 'true'
        run: |
          cd workspace
          git checkout -- apps packages nx.json tsconfig.json package.json .vscode/extensions.json
          git clean -fd apps packages libs tools .vscode .gitignore \
            babel.config.json jest.config.ts jest.preset.cjs

      # pnpm-lock.yaml is deliberately excluded from the checkout above:
      # it still carries both the `nx migrate` version bump (the PR's
      # actual payload) and the smoke test's now-reverted generated
      # packages. Re-running install against the just-restored
      # package.json files regenerates the lockfile so it drops the
      # generated-package entries while keeping the migrate bump —
      # a plain `git checkout` of the lockfile would silently discard
      # the bump along with the smoke-test noise.
      - if: steps.diff.outputs.changed == 'true'
        run: cd workspace && pnpm install --no-frozen-lockfile

      - if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(workspace): nx migrate to latest"
          title: "chore(workspace): nx migrate to latest"
          body: |
            Automated `nx migrate latest` against `workspace/`, gated on:

            - `nx run-many --target=lint,typecheck,test,build --all`
            - `nx run-many --target=e2e --all`
            - a full domain-module generator smoke test (schema through screen) followed by `typecheck,build`
            - an add-on gate: `@nx/expo`'s pin in `workspace/addon-versions.json` asserted equal to the `@nx/*` matrix, then all three add-ons (Auth, Queue, Mobile) scaffolded against the migrated tree and typechecked

            Review the diff — especially anything under `workspace/tools/generators` — before merging. Merging does not publish; bump `package.json` separately to release.
          branch: nx-migrate/scheduled
          delete-branch: true
          add-paths: workspace

      # Runs on any prior step failure so a red scheduled run surfaces
      # somewhere a human sees it, instead of only in the Actions tab.
      # Reuses one open issue across consecutive failures (rather than
      # opening a new one each week) so repeated runs don't spam the
      # tracker.
      - if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "nx-migrate workflow is failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = "automation-failure";

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            const open = existing.find((issue) => issue.title === title);
            const body = `The scheduled \`nx-migrate\` workflow failed: ${runUrl}`;

            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              // GitHub creates a label on the fly from `labels` if the
              // repo doesn't have it yet, so this works even before
              // label-sync (which only runs on push to main) picks up
              // the definition added to .github/labels.yml.
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
