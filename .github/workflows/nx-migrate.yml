name: Nx migrate

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: github.repository == 'skyf0xx/hedgehog-core-full-stack-app'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      - run: cd workspace && pnpm install --frozen-lockfile

      # nx migrate resolves nx + every @nx/* plugin to one mutually
      # compatible version set (Nx's own coupled-upgrade tool) and
      # applies the codemods each migration needs, then --run-migrations
      # applies them and deletes the generated migrations.json. A plain
      # version bump with no codemods never writes migrations.json in
      # the first place — --if-exists makes that a successful no-op
      # instead of the fatal "File 'migrations.json' doesn't exist"
      # error, so the diff step below still runs and correctly reports
      # no change.
      - run: cd workspace && npx nx migrate latest

      - run: cd workspace && npx nx migrate --run-migrations --if-exists

      - run: cd workspace && pnpm install --no-frozen-lockfile

      - id: diff
        run: |
          if git diff --quiet -- workspace; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.diff.outputs.changed == 'true'
        run: cd workspace && npx nx run-many --target=lint,typecheck,test,build --all

      - if: steps.diff.outputs.changed == 'true'
        run: cd workspace && npx playwright install --with-deps

      - if: steps.diff.outputs.changed == 'true'
        run: cd workspace && npx nx run-many --target=e2e --all

      # Proves the migration didn't just leave existing apps working —
      # it must also leave every layer generator producing code that
      # still typechecks and builds, since scaffolding a fresh domain
      # module is the first thing a consuming project does after
      # `hedgehog init`. Runs in dependency order (schema before
      # contract before repository/service before controller/hook
      # before screen) and the generated module is discarded, not
      # committed — this is a smoke test, not a fixture.
      - if: steps.diff.outputs.changed == 'true'
        run: |
          cd workspace
          FIELDS="title:string(500),done:boolean"
          npx nx g @hedgehog/generators:schema ci-smoke-test --fields="$FIELDS" --no-interactive
          npx nx g @hedgehog/generators:contract ci-smoke-test --fields="$FIELDS" --no-interactive
          npx nx g @hedgehog/generators:repository ci-smoke-test --no-interactive
          npx nx g @hedgehog/generators:service ci-smoke-test --no-interactive
          npx nx g @hedgehog/generators:controller ci-smoke-test --fields="$FIELDS" --no-interactive
          npx nx g @hedgehog/generators:hook ci-smoke-test --no-interactive
          npx nx g @hedgehog/generators:screen ci-smoke-test --no-interactive

      # The controller/hook generators add new workspace:* deps (the
      # contract/repository/service/hook libs they wire up) to
      # apps/api/package.json and apps/web/package.json. Those only
      # exist as node_modules symlinks after another install — without
      # this, typecheck/build below fails with "Cannot find module"
      # for every generated package, even though the generators
      # themselves ran cleanly.
      - if: steps.diff.outputs.changed == 'true'
        run: cd workspace && pnpm install --no-frozen-lockfile

      # api/web's own typecheck only resolves the generated libs'
      # .d.ts files from disk — it doesn't build them. Typechecking
      # --all first walks the project graph in dependency order (the
      # new contracts/hooks/repository/service libs before api/web),
      # so their declaration output exists by the time api/web needs
      # it. Skipping this makes api/web:typecheck fail with TS6305
      # ("output file has not been built from source file") even
      # though every project passes typecheck individually.
      - if: steps.diff.outputs.changed == 'true'
        run: cd workspace && npx nx run-many --target=typecheck --all

      - if: steps.diff.outputs.changed == 'true'
        run: cd workspace && npx nx run-many --target=build --projects=api,web

      # The generators both add new files under apps/, packages/, and
      # libs/, and rewrite existing barrel files in place (e.g.
      # packages/db/src/schema/index.ts) — checkout alone reverts the
      # rewrites, clean removes the new files, and both must run across
      # all three roots the seven generators actually write to. The
      # smoke-test install above also adds the generated packages to
      # pnpm-lock.yaml, so that needs reverting too or it'd drift out
      # of sync with the package.json files checkout just restored.
      - if: steps.diff.outputs.changed == 'true'
        run: |
          cd workspace
          git checkout -- apps packages libs pnpm-lock.yaml
          git clean -fd apps packages libs

      - if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(workspace): nx migrate to latest"
          title: "chore(workspace): nx migrate to latest"
          body: |
            Automated `nx migrate latest` against `workspace/`, gated on:

            - `nx run-many --target=lint,typecheck,test,build --all`
            - `nx run-many --target=e2e --all`
            - a full domain-module generator smoke test (schema through screen) followed by `typecheck,build`

            Review the diff — especially anything under `workspace/tools/generators` — before merging. Merging does not publish; bump `package.json` separately to release.
          branch: nx-migrate/scheduled
          delete-branch: true
          add-paths: workspace
