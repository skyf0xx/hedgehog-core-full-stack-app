name: Check

on:
  push:
    branches:
      - main
  pull_request:

# The read-only token and --ignore-scripts below are what make it safe to
# approve this workflow on a fork's pull request: the run gets a
# disposable runner, no repository write access and no secrets, and a
# contributor's package lifecycle scripts never execute. Keep it on
# `pull_request` — `pull_request_target` would hand the fork's code a
# token with write scope.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install --ignore-scripts --no-audit --no-fund

      - run: npm pack --dry-run

      # These drive the real workspace/ lefthook.yml and pinned lefthook
      # binary against a real `git commit`, proving the commit gate runs
      # on a fresh install and fails closed when its tooling is missing.
      # Hermetic — no network beyond the lefthook binary's own install,
      # which each reproduction declares in its own header.
      - run: node repro/first-commit-rejected.mjs

      - run: node repro/commit-gate-fails-open.mjs
